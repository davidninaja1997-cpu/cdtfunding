<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club del Trader — Muy pronto</title>
<meta name="description" content="Club del Trader — Estamos preparando algo nuevo. Vuelve pronto.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/logo/cdt-icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#07090B;
  --panel:#0D1116;
  --line:#1D242E;
  --text:#F2F5F8;
  --muted:#8C96A3;
  --gold:#E8B84B;
  --gold-2:#F5D078;
  --green:#16D89A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;overflow:hidden;position:relative;
}
body::before{
  content:'';position:absolute;inset:-30% -10% auto -10%;height:80%;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 50% 15%,rgba(232,184,75,.12),transparent 65%);
}
.wrap{position:relative;max-width:440px}
.logo{width:88px;height:88px;border-radius:22px;margin:0 auto 30px;display:block;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.badge{
  display:inline-flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.04em;
  color:var(--gold-2);border:1px solid rgba(232,184,75,.35);border-radius:999px;
  padding:8px 18px;background:rgba(232,184,75,.06);margin-bottom:26px;
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
h1{font-size:clamp(28px,7vw,42px);font-weight:800;line-height:1.15;margin-bottom:16px;letter-spacing:-.02em}
h1 .gold{color:var(--gold)}
p{color:var(--muted);font-size:16px;line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo/cdt-icono.svg" alt="Club del Trader">
    <div class="badge"><span class="dot"></span> Muy pronto</div>
    <h1>Estamos preparando<br>algo <span class="gold">nuevo</span>.</h1>
    <p>Club del Trader vuelve pronto con una nueva experiencia. Gracias por tu paciencia.</p>
  </div>
</body>
</html>
